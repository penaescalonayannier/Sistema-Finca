services:
  postgres:
    image: postgres:16-alpine
    container_name: finca-postgres
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finca-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./contabilidad
    container_name: finca-backend
    ports:
      - "9908:9908"
    environment:
      - RC_ACTIVE_PROFILE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/store
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_READ_DATASOURCE_URL=jdbc:postgresql://postgres:5432/store
      - SPRING_READ_DATASOURCE_USERNAME=postgres
      - SPRING_READ_DATASOURCE_PASSWORD=postgres
      - SPRING_DATA_REDIS_HOST=redis
      - REDIS_HOST=redis
      - REDIS_ADDRESS=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9908/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./mi-proyecto-vue/mi-proyecto
    container_name: finca-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
